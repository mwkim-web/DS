<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid · GolfVX DS</title>
<link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="../../assets/css/site.css">
<script>try{var t=localStorage.getItem("gvx-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  .bp-row { grid-template-columns: 1.2fr 1fr 1fr .8fr .8fr; }
  .cols { display: flex; height: 120px; }
  .cols i { flex: 1; background: var(--checker); opacity: .7; border-radius: 2px; }
  .card .label { font-size: 13px; font-weight: 500; color: var(--label-strong); margin-bottom: 16px; }
</style>
</head>
<body data-section="foundations" data-page="grid">
<div id="gvx-gnb"></div>
<div class="layout">
<div id="gvx-sidebar"></div>
<main class="main" id="main">
  <div id="gvx-crumb"></div>
  <header class="page-head">
    <h1 class="page-title">Grid</h1>
    <p class="page-desc">GolfVX DS의 그리드 시스템은 플랫폼별 최적화된 컬럼 구조를 제공합니다.</p>
  </header>
  <section class="section">
    <h2 id="breakpoints">Breakpoints</h2>
    <p class="desc">플랫폼별 브레이크포인트 기준입니다.</p>
    <div class="table table-scroll" id="bp"></div>
  </section>
  <section class="section">
    <h2 id="visual">Visual</h2>
    <p class="desc">플랫폼별 그리드 시각화입니다.</p>
    <div class="cards c3" id="vis"></div>
  </section>
</main>
<div id="gvx-toc"></div>
</div>
<div id="gvx-footer"></div>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/tokens.js"></script>
<script>
(function () {
  var G = window.GVX_TOKENS.grid;
  document.getElementById("bp").innerHTML =
    '<div class="tr th bp-row"><span>Platform</span><span>Breakpoint</span><span>Columns</span><span>Gutter</span><span>Margin</span></div>' +
    G.map(function (g) {
      return '<div class="tr bp-row"><span class="k">' + g[0] + '</span><span class="v">' + g[1] + '</span><span class="v">' + g[2] +
        ' columns</span><span class="v">' + g[3] + 'px</span><span class="v">' + g[4] + "px</span></div>";
    }).join("");
  // Visual: Mobile / Tablet / Desktop. Gutters are scaled down to fit the card.
  var scaled = { 4: 8, 8: 6, 12: 4 };
  document.getElementById("vis").innerHTML = G.slice(0, 3).map(function (g) {
    var cols = new Array(g[2] + 1).join("<i></i>");
    return '<div class="card"><div class="label">' + g[0] + " " + g[2] + 'col</div><div class="cols" style="gap:' + scaled[g[2]] + 'px">' + cols + "</div></div>";
  }).join("");
})();
</script>
<script src="../../assets/js/layout.js"></script>
</body>
</html>
